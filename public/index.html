<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Code Analyzer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2360a5fa'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='monospace' font-weight='bold' fill='%2306121f'>CA</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #1a1a24;
    --panel2: #22222f;
    --border: #2e2e3f;
    --text: #e6e6f0;
    --muted: #9d9db4;
    --accent: #60a5fa;
    --green: #2bb673;
    --green-bg: rgba(43, 182, 115, 0.12);
    --yellow: #d9a441;
    --yellow-bg: rgba(217, 164, 65, 0.12);
    --red: #e5534b;
    --red-bg: rgba(229, 83, 75, 0.12);
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 0 22px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  header .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: grid; place-items: center; font-weight: 800; font-size: 16px;
  }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  header .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 18px;
  }
  .card h2 { font-size: 13px; font-weight: 600; margin-bottom: 14px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; }

  label { display: block; font-size: 13px; font-weight: 500; margin: 0 0 8px; }
  textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-family: var(--mono); font-size: 13.5px; line-height: 1.55;
    resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea#code { min-height: 300px; }
  input[type="number"] {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-family: var(--mono); font-size: 15px; font-weight: 600;
    width: 180px; outline: none;
  }
  input[type="number"]:focus { border-color: var(--accent); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1; min-width: 200px; }
  select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; outline: none; cursor: pointer;
  }

  .actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  #analyzeBtn {
    background: var(--accent); color: #06121f; border: none; border-radius: 8px;
    padding: 12px 28px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: transform .05s, filter .15s;
  }
  #analyzeBtn:hover { filter: brightness(1.08); }
  #analyzeBtn:active { transform: translateY(1px); }
  #analyzeBtn:disabled { opacity: .55; cursor: not-allowed; }
  .status { font-size: 13px; color: var(--muted); }

  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.25);
    border-top-color: #fff; border-radius: 50%; display: inline-block;
    animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  .problem-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 18px;
  }
  .problem-bar .ptitle { font-weight: 700; font-size: 15px; }
  .problem-bar a { color: var(--accent); text-decoration: none; font-size: 13px; }
  .problem-bar a:hover { text-decoration: underline; }
  .diff { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
  .diff.Easy { background: rgba(43, 182, 115, .18); color: var(--green); }
  .diff.Medium { background: rgba(217, 164, 65, .18); color: var(--yellow); }
  .diff.Hard { background: rgba(229, 83, 75, .18); color: var(--red); }

  .verdict { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px;
    border-radius: 10px; border: 1px solid var(--border); margin-bottom: 18px; }
  .verdict .badge {
    font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
    white-space: nowrap; margin-top: 2px;
  }
  .verdict .msg { font-size: 15px; font-weight: 600; }
  .verdict.passed { background: var(--green-bg); border-color: var(--green); }
  .verdict.passed .badge { background: var(--green); color: #04160c; }
  .verdict.needs { background: var(--yellow-bg); border-color: var(--yellow); }
  .verdict.needs .badge { background: var(--yellow); color: #1c1503; }
  .verdict.incorrect { background: var(--red-bg); border-color: var(--red); }
  .verdict.incorrect .badge { background: var(--red); color: #fff; }

  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--muted);
  }

  .approach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .approach-grid { grid-template-columns: 1fr; } }
  .sub-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .sub-panel h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .sub-panel p { font-size: 14px; line-height: 1.5; }
  .key-idea {
    margin-top: 14px; background: var(--panel2); border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 14px; line-height: 1.5;
  }
  .key-idea b { color: var(--accent); }

  .cx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .cx-grid { grid-template-columns: 1fr; } }
  .chip { display: inline-block; font-family: var(--mono); font-size: 13px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; margin: 4px 6px 4px 0; }
  .chip b { color: var(--text); }
  .chip .k { color: var(--muted); font-family: inherit; margin-right: 5px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td .line { font-family: var(--mono); font-size: 12px; color: var(--accent); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }

  ul.clean { list-style: none; }
  ul.clean li { position: relative; padding: 8px 0 8px 26px; font-size: 14px; line-height: 1.5; }
  ul.clean li::before {
    content: ""; position: absolute; left: 4px; top: 15px;
    width: 7px; height: 7px; border-radius: 2px; background: var(--accent);
  }
  .followup { background: var(--panel2); border: 1px dashed var(--border); border-radius: 10px; padding: 16px; font-size: 14.5px; line-height: 1.55; }
  .followup b { color: var(--accent); }

  .error-box { background: var(--red-bg); border: 1px solid var(--red); color: #ffb4ae;
    border-radius: 10px; padding: 14px 16px; font-size: 14px; }

  .muted { color: var(--muted); font-size: 13px; }
  #result { margin-top: 6px; }
  .skeleton { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header style="padding: 6px 0 22px; border-bottom: none;">
    <div style="display:flex; align-items:center; gap:10px">
      <div class="logo">CA</div>
      <h1 style="font-size:16px; font-weight:700">Code Analyzer</h1>
    </div>
  </header>

  <div class="card">
    <h2>Input</h2>
    <div class="row">
      <div class="field" style="flex:0 0 220px">
        <label for="number">LeetCode Question No.</label>
        <input type="number" id="number" min="1" placeholder="e.g. 242" />
      </div>
      <div class="field" style="flex:0 0 220px">
        <label for="language">Language</label>
        <select id="language">
          <option>Go</option>
          <option>C++</option>
          <option>Java</option>
          <option>C</option>
          <option>JavaScript</option>
          <option>TypeScript</option>
          <option>Python3</option>
          <option>Rust</option>
        </select>
      </div>
    </div>

    <div style="height:14px"></div>
    <label for="code">Your solution</label>
    <textarea id="code" placeholder="Paste your solution code here..." spellcheck="false"></textarea>

    <div class="actions">
      <button id="analyzeBtn">Analyze</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div id="problemBar" class="problem-bar hidden"></div>

  <div id="result" class="hidden">
    <div id="verdictBox" class="verdict hidden">
      <span class="badge" id="verdictBadge"></span>
      <div>
        <div class="msg" id="verdictMsg"></div>
        <div class="muted" id="verdictTags" style="margin-top:8px"></div>
      </div>
    </div>

    <div class="card" id="approachCard">
      <h2>Approach</h2>
      <div class="approach-grid">
        <div class="sub-panel">
          <h3>Current</h3>
          <p id="curApproach"></p>
        </div>
        <div class="sub-panel">
          <h3>Suggested</h3>
          <p id="sugApproach"></p>
        </div>
      </div>
      <div class="key-idea" id="keyIdeaBox"><b>Key Idea:</b> <span id="keyIdea"></span></div>
    </div>

    <div class="card" id="efficiencyCard">
      <h2>Efficiency</h2>
      <div class="cx-grid">
        <div class="sub-panel">
          <h3>Your solution</h3>
          <span class="chip"><b id="curTime"></b><span class="k">Time</span></span>
          <span class="chip"><b id="curSpace"></b><span class="k">Space</span></span>
        </div>
        <div class="sub-panel">
          <h3>Optimal</h3>
          <span class="chip"><b id="sugTime"></b><span class="k">Time</span></span>
          <span class="chip"><b id="sugSpace"></b><span class="k">Space</span></span>
        </div>
      </div>
      <p class="muted" id="effAnalysis" style="margin-top:14px; line-height:1.6"></p>
    </div>

    <div class="card" id="styleCard">
      <h2>Code Style</h2>
      <table>
        <thead><tr><th style="width:110px">Line</th><th>Issue</th><th>Suggestion</th></tr></thead>
        <tbody id="styleRows"></tbody>
      </table>
    </div>

    <div class="card" id="suggestionsCard">
      <h2>Suggestions</h2>
      <ul class="clean" id="suggestionsList"></ul>
    </div>

    <div class="card" id="followUpCard">
      <h2>Follow-up</h2>
      <div class="followup" id="followUpText"></div>
    </div>
  </div>

  <div id="errorBox" class="error-box hidden"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const btn = $("analyzeBtn");
const statusEl = $("status");

btn.addEventListener("click", async () => {
  const number = $("number").value.trim();
  const code = $("code").value.trim();
  const language = $("language").value;

  if (!number || !code) {
    statusEl.textContent = "Question number aur code dono bharo bhai 🙂";
    statusEl.style.color = "#ffb4ae";
    setTimeout(() => { statusEl.textContent = ""; }, 2500);
    return;
  }

  $("result").classList.add("hidden");
  $("problemBar").classList.add("hidden");
  $("errorBox").classList.add("hidden");
  btn.disabled = true;
  statusEl.innerHTML = '<span class="spinner"></span> Problem fetch + Analyzing...';
  statusEl.style.color = "";

  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ number, code, language }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || "Analysis failed");

    if (data.meta) renderProblem(data.meta);
    render(data.result);
    statusEl.textContent = "Done ✓";
  } catch (e) {
    $("errorBox").textContent = "⚠ " + e.message;
    $("errorBox").classList.remove("hidden");
    statusEl.textContent = "Failed";
  } finally {
    btn.disabled = false;
    setTimeout(() => { statusEl.textContent = ""; }, 3000);
  }
});

function renderProblem(m) {
  const bar = $("problemBar");
  bar.innerHTML = `
    <span class="diff ${m.difficulty}">${m.difficulty}</span>
    <span class="ptitle">${escapeHtml(m.id)}. ${escapeHtml(m.title)}</span>
    <a href="${escapeHtml(m.url)}" target="_blank" rel="noopener">Open on LeetCode ↗</a>
  `;
  if (m.tags && m.tags.length) {
    const wrap = document.createElement("div");
    wrap.style.marginLeft = "auto";
    wrap.style.display = "flex";
    wrap.style.gap = "6px";
    wrap.style.flexWrap = "wrap";
    m.tags.slice(0, 5).forEach((t) => {
      const s = document.createElement("span");
      s.className = "tag";
      s.textContent = t;
      wrap.appendChild(s);
    });
    bar.appendChild(wrap);
  }
  bar.classList.remove("hidden");
}

function render(r) {
  const vb = $("verdictBox");
  vb.className = "verdict " + r.verdict;
  const badgeMap = {
    passed: "Correct & Efficient",
    needs_improvement: "Correct, Optimizable",
    incorrect: "Incorrect",
  };
  $("verdictBadge").textContent = badgeMap[r.verdict] || r.verdict;
  $("verdictMsg").textContent = r.verdictMessage || "";
  $("verdictTags").textContent = "";

  $("curApproach").textContent = r.approaches?.current || "-";
  $("sugApproach").textContent = r.approaches?.suggested || "-";
  $("keyIdea").textContent = r.approaches?.keyIdea || "-";

  $("curTime").textContent = r.complexity?.current?.time || "-";
  $("curSpace").textContent = r.complexity?.current?.space || "-";
  $("sugTime").textContent = r.complexity?.suggested?.time || "-";
  $("sugSpace").textContent = r.complexity?.suggested?.space || "-";
  $("effAnalysis").textContent = r.efficiencyAnalysis || "";

  const tbody = $("styleRows");
  tbody.innerHTML = "";
  const styleItems = Array.isArray(r.codeStyle) ? r.codeStyle : [];
  if (styleItems.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="muted">No style issues found — clean code 🎉</td></tr>';
  } else {
    styleItems.forEach((it) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td><span class="line">${escapeHtml(it.line || "-")}</span></td>
        <td>${escapeHtml(it.issue || "")}</td>
        <td>${escapeHtml(it.suggestion || "")}</td>`;
      tbody.appendChild(tr);
    });
  }

  const list = $("suggestionsList");
  list.innerHTML = "";
  (r.suggestions || []).forEach((s) => {
    const li = document.createElement("li");
    li.textContent = s;
    list.appendChild(li);
  });

  $("followUpText").innerHTML = "<b>Follow-up:</b> " + escapeHtml(r.followUp || "-");

  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
</script>
</body>
</html>
